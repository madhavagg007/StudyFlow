name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static checks
        run: npm run check
      - name: Unit and smoke tests
        run: npm test
      - name: Build single-file bundle
        run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-single-file
          path: dist/StudyFlow.html
