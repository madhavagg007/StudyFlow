function printReport(){let el=document.getElementById('printReport');if(!el){el=document.createElement('div');el.id='printReport';document.body.appendChild(el)}let all=readiness(state.chapters),d=examDaysLeft(),st=stats(),days=[];for(let i=6;i>=0;i--){let dt=new Date();dt.setDate(dt.getDate()-i);let k=dt.toISOString().slice(0,10);days.push({k,m:state.sessions.filter(x=>x.date===k).reduce((a,x)=>a+(Number(x.minutes)||0),0)})}let tot=days.reduce((a,x)=>a+x.m,0),rows=subjectNames().map(s=>{let l=state.chapters.filter(c=>c.subject===s);return l.length?`<h3>${esc(s)} <span style="font-weight:400">· readiness ${readiness(l)}/100</span></h3><table>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.status)}</td><td>${c.mastery||0}%</td></tr>`).join('')}</table>`:''}).join('');el.innerHTML=`<h1>StudyFlow progress report</h1><p>${esc(state.profile.name||'Student')} · ${new Date().toLocaleDateString()}${state.profile.exam?' · '+esc(state.profile.exam):''}</p><p><b>Overall readiness: ${all}/100 (${readyLabel(all)})</b>${d!==null&&d>=0?' · '+d+' days to exam':''}</p><p>Average mastery ${st.avg}% · ${currentStreak()} day streak · ${tot} focus minutes this week · ${backlogItems().length} chapters in backlog · ${state.mistakes.length} mistakes logged</p>${rows}`;window.print()}
</script>
<script>
// StudyFlow: Toast, end-of-day review and weekly insight
function toast(msg){let el=document.getElementById('studyToast');if(!el){el=document.createElement('div');el.id='studyToast';el.className='toast';document.body.appendChild(el)}el.textContent=msg;el.classList.add('show');clearTimeout(window.__studyToast);window.__studyToast=setTimeout(()=>el.classList.remove('show'),2200)}
function endOfDayReview(){let gc=goalProgress(),ac=todayCompletion(),mins=gc.done,done=ac.done,total=ac.total,rev=state.revisions.filter(r=>!r.done&&r.date<=today()).length,errs=state.mistakes.filter(m=>!m.reattempted).length;let status=mins>=gc.goal?'Goal reached':mins>=Math.round(gc.goal*.7)?'Solid day':'Room to recover';openSheet(`<div class="row"><div><div class="eyebrow">DAILY REVIEW</div><h2>${status}</h2></div><button class="btn light" onclick="closeModal()">Close</button></div><div class="brief-grid"><div class="brief-stat"><b>${mins}m</b><span>FOCUS</span></div><div class="brief-stat"><b>${done}/${total}</b><span>ACTIONS</span></div><div class="brief-stat"><b>${currentStreak()}</b><span>STREAK</span></div></div><div class="item" style="margin-top:12px"><b>Tomorrow's first move</b><div class="mini" style="margin-top:5px">${esc(dailyPlan()[0]?.label||'Review your weakest chapter before adding new work.')}</div></div><div class="item" style="margin-top:8px"><b>Signals to carry forward</b><div class="mini" style="margin-top:5px">${rev} revision checkpoint(s) due · ${errs} unresolved mistake(s).</div></div><button class="btn" style="margin-top:12px" onclick="closeModal()">Finish review</button>`)}
function weeklyInsight(){let since=new Date();since.setDate(since.getDate()-6);let ds=since.toISOString().slice(0,10),mins=state.sessions.filter(s=>s.date>=ds).reduce((a,x)=>a+x.minutes,0),tests=state.tests.filter(t=>t.date>=ds).length,errs=state.mistakes.filter(m=>m.date>=ds).length;return `${mins} focus minutes, ${tests} test${tests===1?'':'s'}, ${errs} mistake${errs===1?'':'s'} logged in the last 7 days. Use the signals to adjust next week.`}
function action(kind,ref){if(kind==='revision'){doneRevision(ref);go('Revision')}else if(kind==='mistake'){let m=state.mistakes.find(x=>x.id===ref);if(m){m.reattempted=true;save()}go('Mistakes')}else{let c=state.chapters.find(x=>x.id===ref);if(c)openChapter(c.id)}}
</script>
<script>
// StudyFlow: Syllabus map and spaced revision
function syllabus(){document.getElementById('app').innerHTML=`<div class="row"><div><h2>Syllabus map</h2><div class="muted">Mastery + confidence + recency feed the priority engine.</div></div><div class="controls">${sampleChapters().length?'<button class="btn warn" onclick="removeSampleChapters()">Remove sample chapters</button>':''}<button class="btn light" onclick="openSubjectManager()">Subjects</button><button class="btn" onclick="addChapter()">+ Chapter</button></div></div><div style="height:12px"></div><div class="grid">${subjectNames().map(s=>`<section class="card span4"><h3>${s}</h3><div class="list">${state.chapters.filter(c=>c.subject===s).map(c=>`<div class="item"><div class="row"><b>${esc(c.name)}</b><span class="tag ${c.mastery>=80?'good':c.mastery<50?'bad':'warn'}">${priorityLabel(priority(c))}</span></div><div class="mini" style="margin:5px 0">${c.mastery}% mastery · confidence ${c.confidence}/5</div><div class="bar"><div class="fill" style="width:${c.mastery}%"></div></div><div class="controls" style="margin-top:9px"><button class="btn soft small" onclick="openChapter('${c.id}')">Update</button><button class="btn light small" onclick="scheduleFor('${c.id}')">Schedule</button></div></div>`).join('')}</div></section>`).join('')}</div>`}
function openChapter(id){let c=state.chapters.find(x=>x.id===id);if(!c)return;openSheet(`<div class="row"><div><div class="eyebrow">${esc(c.subject)}</div><h2>${esc(c.name)}</h2></div><button class="btn light" onclick="closeModal()">Close</button></div><div class="formgrid"><label>Mastery %<input class="input" id="cm" type="number" min="0" max="100" value="${c.mastery}"></label><label>Confidence / 5<input class="input" id="cc" type="number" min="0" max="5" value="${c.confidence}"></label><label>Status<select id="cs"><option ${c.status==='Not started'?'selected':''}>Not started</option><option ${c.status==='Learning'?'selected':''}>Learning</option><option ${c.status==='Practising'?'selected':''}>Practising</option><option ${c.status==='Strong'?'selected':''}>Strong</option></select></label><label>Last studied<input class="input" id="cl" type="date" value="${c.lastStudied||today()}"></label></div><p class="mini" style="margin-top:10px">Priority: <b>${priorityLabel(priority(c))}</b>. The engine raises priority when mastery/confidence is low, study is stale, revisions are due, or tests/mistakes point here.</p><div class="controls"><button class="btn" onclick="saveChapter('${c.id}')">Save + schedule</button><button class="btn soft" onclick="quickRecall('${c.id}')">30-sec recall</button></div>`)}
function saveChapter(id){let c=state.chapters.find(x=>x.id===id);c.mastery=Math.max(0,Math.min(100,Number(document.getElementById('cm').value)||0));c.confidence=Math.max(0,Math.min(5,Number(document.getElementById('cc').value)||0));c.status=document.getElementById('cs').value;c.lastStudied=document.getElementById('cl').value||today();if(c.mastery>=80)c.status='Strong';else if(c.mastery>0&&c.status==='Not started')c.status='Learning';scheduleFor(id,true);save();closeModal();render()}
function scheduleFor(id,silent=false){let c=state.chapters.find(x=>x.id===id);if(!c)return;state.revisions=state.revisions.filter(r=>!(r.chapterId===id&&!r.done&&r.date>=today()));let base=Math.max(1,Math.round((100-(c.mastery||0))/20));let gaps=c.mastery<40?[1,2,5,10]:c.mastery<70?[1,3,7,14]:[2,7,14,30];let start=c.lastStudied&&c.lastStudied>=today()?c.lastStudied:today();gaps.forEach((g,i)=>state.revisions.push({id:uid(),chapterId:id,chapter:c.name,subject:c.subject,date:addDays(start,g),round:i+1,done:false}));save();if(!silent)toast(`Adaptive checkpoints created for ${c.name}.`);if(!silent)render()}
function revision(){let due=state.revisions.filter(r=>!r.done&&r.date<=today()).sort((a,b)=>a.date.localeCompare(b.date)),planned=state.revisions.filter(r=>!r.done&&r.date>today()).sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('app').innerHTML=`<div class="row"><div><h2>Revision engine</h2><div class="muted">Intervals adapt to mastery: weaker chapters return sooner.</div></div><button class="btn" onclick="openRevision()">+ Plan revision</button></div><div style="height:12px"></div><div class="grid"><section class="card span7"><h3>Due now</h3><div class="list">${due.map(r=>revisionCard(r)).join('')||'<div class="empty">Nothing overdue. Good — use the time for your highest-priority chapter.</div>'}</div></section><section class="card span5"><h3>Planned</h3><div class="list">${planned.slice(0,12).map(r=>revisionCard(r)).join('')||'<div class="empty">No future checkpoints.</div>'}</div></section></div>`}
function revisionCard(r){return `<div class="item"><div class="row"><div><b>${esc(r.chapter)}</b><div class="mini">${esc(r.subject)} · ${esc(r.date)} · Round ${r.round}</div></div><span class="tag ${r.done?'good':r.date<=today()?'warn':''}">${r.done?'Done':r.date<=today()?'Due':'Planned'}</span></div>${!r.done?`<div class="controls" style="margin-top:8px"><button class="btn soft small" onclick="doneRevision('${r.id}')">Mark recalled</button><button class="btn light small" onclick="rescheduleRevision('${r.id}')">Need more time</button></div>`:''}</div>`}
function doneRevision(id){let r=state.revisions.find(x=>x.id===id);if(!r)return;r.done=true;let c=state.chapters.find(x=>x.id===r.chapterId);if(c){c.lastStudied=today();c.mastery=Math.min(100,(c.mastery||0)+Math.max(2,Math.round((5-(c.confidence||0))*1.2)));c.confidence=Math.min(5,(c.confidence||0)+1)}save();render()}
function rescheduleRevision(id){let r=state.revisions.find(x=>x.id===id);if(r){r.date=addDays(today(),2);save();render()}}
function openRevision(){let options=state.chapters.map(c=>`<option value="${c.id}">${esc(c.subject)} — ${esc(c.name)}</option>`).join('');openSheet(`<h2>Plan revision</h2><select class="input" id="rc">${options}</select><div class="controls" style="margin-top:12px"><button class="btn" onclick="planCustom()">Create adaptive checkpoints</button><button class="btn light" onclick="closeModal()">Cancel</button></div>`)}
function planCustom(){scheduleFor(document.getElementById('rc').value);closeModal()}
</script>
<script>
// StudyFlow: Mistake log and test tracking
function mistakes(){let types={Concept:0,Calculation:0,Careless:0,Time:0};state.mistakes.forEach(m=>types[m.type]=(types[m.type]||0)+1);let top=Object.entries(types).sort((a,b)=>b[1]-a[1])[0];document.getElementById('app').innerHTML=`<div class="row"><div><h2>Error book</h2><div class="muted">Inspired by Achievers' error-book idea: record the cause and the prevention, not just the wrong answer.</div></div><button class="btn" onclick="addMistake()">+ Mistake</button></div><div style="height:12px"></div><div class="grid"><section class="card span4"><h3>Pattern</h3><div class="kpi" style="font-size:28px">${top&&top[1]?esc(top[0]):'—'}</div><div class="mini">Most common error type</div></section><section class="card span8"><h3>Rule</h3><p class="quote">Every mistake should end with a prevention action. Reattempt unresolved mistakes before adding more passive study.</p></section><section class="card span12"><div class="list">${state.mistakes.slice().reverse().map(m=>`<div class="item"><div class="row"><b>${esc(m.topic)}</b><span class="tag ${m.reattempted?'good':'warn'}">${m.reattempted?'Reattempted':'Unresolved'}</span></div><div class="mini">${esc(m.subject)} · ${esc(m.chapter||'Custom chapter')} · ${esc(m.date)} · ${esc(m.type)}</div>${m.photo?`<div class="mistake-photo"><img src="${m.photo}" alt="Attached mistake photo" loading="lazy"></div>`:''}<p style="margin:8px 0 4px"><b>Why:</b> ${esc(m.why)}</p><p style="margin:0"><b>Fix:</b> ${esc(m.fix)}</p><div class="controls" style="margin-top:9px"><button class="btn soft small" onclick="markMistake('${m.id}')">${m.reattempted?'Mark unresolved':'Mark reattempted'}</button></div></div>`).join('')||'<div class="empty">Your error book is empty.</div>'}</div></section></div>`}
function markMistake(id){let m=state.mistakes.find(x=>x.id===id);if(m){m.reattempted=!m.reattempted;save();render()}}
function addMistake(){
  const options=state.chapters.map(c=>`<option value="${c.id}">${esc(c.subject)} — ${esc(c.name)}</option>`).join('');
  const subjects=subjectNames().map(s=>`<option>${esc(s)}</option>`).join('');
  openSheet(`<h2>Log a mistake</h2>
  <div class="formgrid">
    <label>Chapter<select id="mc" onchange="toggleCustomMistakeChapter()"><option value="">Select chapter</option>${options}<option value="__custom__">＋ Custom chapter</option></select></label>
    <label class="hide" id="customChapterWrap">Custom chapter<input class="input" id="mcustomChapter" placeholder="e.g. Electrostatics — Current Electricity"></label>
    <label class="hide" id="customSubjectWrap">Subject<select id="mSubject">${subjects}</select></label>
    <label>Type<select id="mx"><option>Concept</option><option>Calculation</option><option>Careless</option><option>Time</option></select></label>
    <label>Topic<input class="input" id="mt" placeholder="What concept/question?"></label>
    <label>Why?<input class="input" id="mw" placeholder="What caused it?"></label>
    <label class="full">Fix / prevention<textarea class="input" id="mf" rows="3" placeholder="What will you do differently?"></textarea></label>
    <label class="full">Photo / question image<input class="input" id="mphoto" type="file" accept="image/*" onchange="previewMistakePhoto(this)"><div id="mphotoPreview" class="mistake-photo-preview hide"></div><div class="mini" style="margin-top:6px">Tap to choose a photo from your phone. If supported by Android, you can also choose the camera.</div></label>
  </div>
  <button class="btn" style="margin-top:12px" onclick="saveMistake()">Save mistake</button>`);
}
function toggleCustomMistakeChapter(){
  const custom=document.getElementById('mc')?.value==='__custom__';
  document.getElementById('customChapterWrap')?.classList.toggle('hide',!custom);
  document.getElementById('customSubjectWrap')?.classList.toggle('hide',!custom);
}
function previewMistakePhoto(input){
  const box=document.getElementById('mphotoPreview');
  const file=input?.files?.[0];
  if(!box)return;
  if(!file){box.classList.add('hide');box.innerHTML='';return;}
  const url=URL.createObjectURL(file);
  box.innerHTML=`<img src="${url}" alt="Mistake photo preview">`;
  box.classList.remove('hide');
}
function compressMistakePhoto(file,done){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
      done(canvas.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>done('');
    img.src=reader.result;
  };
  reader.onerror=()=>done('');
  reader.readAsDataURL(file);
}
function saveMistake(){
  const topic=(document.getElementById('mt')?.value||'').trim();
  const why=(document.getElementById('mw')?.value||'').trim();
  const fix=(document.getElementById('mf')?.value||'').trim();
  const selectedId=document.getElementById('mc')?.value||'';
  const customChapter=(document.getElementById('mcustomChapter')?.value||'').trim();
  const subject=(document.getElementById('mSubject')?.value||subjectNames()[0]||'General').trim();
  const c=state.chapters.find(x=>x.id===selectedId);
  const isCustom=selectedId==='__custom__';
  if(!topic||!why||!fix||(isCustom?!customChapter:!c)){toast(isCustom?'Enter the custom chapter name, topic, cause and prevention.':'Fill the topic, cause, prevention and chapter.');return;}
  const finish=(photoData='')=>{
    const chapterName=isCustom?customChapter:c.name;
    const chapterSubject=isCustom?subject:c.subject;
    state.mistakes.push({id:uid(),chapterId:isCustom?'':c.id,subject:chapterSubject,chapter:chapterName,topic,type:document.getElementById('mx').value,why,fix,date:today(),reattempted:false,photo:photoData||''});
    if(c)c.mastery=Math.max(0,(c.mastery||0)-3);
    save();closeModal();render();toast('Mistake saved');
  };
  const file=document.getElementById('mphoto')?.files?.[0];
  if(file){compressMistakePhoto(file,finish);}else finish('');
}
function tests(){let avg=state.tests.length?Math.round(state.tests.reduce((a,t)=>a+t.score,0)/state.tests.length):0,best=state.tests.length?Math.max(...state.tests.map(t=>t.score)):0;let weakCounts={};state.tests.forEach(t=>(t.weakTopics||[]).forEach(w=>weakCounts[w.name]=(weakCounts[w.name]||0)+1));let topWeak=Object.entries(weakCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);document.getElementById('app').innerHTML=`<div class="row"><div><h2>Test lab</h2><div class="muted">Test results now feed the chapter priority engine.</div></div><button class="btn" onclick="addTest()">+ Test</button></div><div style="height:12px"></div><div class="grid"><section class="card span4"><div class="muted">Average</div><div class="kpi">${avg}%</div></section><section class="card span4"><div class="muted">Best</div><div class="kpi">${best}%</div></section><section class="card span4"><div class="muted">Tests logged</div><div class="kpi">${state.tests.length}</div></section><section class="card span5"><h3>Repeated weak topics</h3>${topWeak.map(w=>`<div class="metric"><span>${esc(w[0])}</span><b>${w[1]}×</b></div>`).join('')||'<div class="empty">Add weak topics to reveal patterns.</div>'}</section><section class="card span7"><div class="list">${state.tests.slice().reverse().map(t=>`<div class="item"><div class="row"><div><b>${esc(t.name)}</b><div class="mini">${esc(t.subject)} · ${esc(t.date)}</div></div><span class="tag ${t.score>=80?'good':t.score<50?'bad':'warn'}">${t.score}%</span></div><div class="mini" style="margin-top:7px">Weak topics: ${esc((t.weakTopics||[]).map(w=>w.name).join(', ')||'None recorded')}</div></div>`).join('')||'<div class="empty">Log your first test.</div>'}</div></section></div>`}
function addTest(){let options=state.chapters.map(c=>`<option value="${c.id}">${esc(c.subject)} — ${esc(c.name)}</option>`).join('');openSheet(`<h2>Log a test</h2><div class="formgrid"><label>Name<input class="input" id="tn" placeholder="JEE mock 01"></label><label>Subject<select id="ts">${subjectNames().map(s=>`<option>${s}</option>`).join('')}</select></label><label>Score %<input class="input" id="tp" type="number" min="0" max="100"></label><label>Date<input class="input" id="td" type="date" value="${today()}"></label><label class="full">Weak chapters<select class="input" id="tw" multiple size="5">${options}</select></label></div><div class="mini" style="margin-top:7px">On Android, tap one or more chapters. These choices raise their priority automatically.</div><button class="btn" style="margin-top:12px" onclick="saveTest()">Save test</button>`)}
function saveTest(){
  const name=(document.getElementById('tn')?.value||'').trim();
  const score=Number(document.getElementById('tp')?.value);
  const date=document.getElementById('td')?.value||today();
  const subject=document.getElementById('ts')?.value||subjectNames()[0]||'General';
  const sel=[...(document.getElementById('tw')?.selectedOptions||[])].map(o=>o.value);
  if(!name||!Number.isFinite(score)||score<0||score>100){toast('Enter a name and a score from 0–100.');return;}
  const weakTopics=sel.map(id=>{let c=state.chapters.find(x=>x.id===id);if(c)c.mastery=Math.max(0,(c.mastery||0)-2);return c?{chapterId:c.id,name:c.name}:null}).filter(Boolean);
  state.tests.push({id:uid(),name,subject,score,date,weakTopics});
  save();closeModal();render();toast('Test saved');
}
</script>
<script>
// StudyFlow: Focus timer, forming book and study library
function libraryMarkup(){
  const sessions=(state.sessions||[]).filter(x=>Number(x.minutes)>0).slice(-24);
  const total=sessions.reduce((a,x)=>a+(Number(x.minutes)||0),0);
  const books=sessions.map((x,i)=>{
    const mins=Math.max(1,Number(x.minutes)||1);
    const width=Math.max(22,Math.min(92,22+mins*0.95));
    const c=state.chapters.find(ch=>ch.id===x.chapterId);
    const title=c?c.name:'Study session';
    const colors=['var(--accent)','var(--gold)','var(--ink)','#6d8f82','#8a7560'];
    return `<div class="library-book" title="${esc(title)} · ${mins} min" style="width:${width}px;background:${colors[i%colors.length]}"><span>${esc(title.slice(0,18))}</span></div>`;
  }).join('');
  return `<section class="card span12 study-library"><div class="row"><div><div class="eyebrow">YOUR STUDY LIBRARY</div><h2>Every session becomes a book.</h2><div class="muted">The longer you study, the thicker the book you add to your library.</div></div><span class="tag good">${sessions.length} book${sessions.length===1?'':'s'}</span></div><div class="library-shelf" style="margin-top:14px"><div style="width:100%">${books?`<div class="library-books">${books}</div>`:'<div class="library-empty">Start your first focus session to add a book here.</div>'}<div class="library-shelf-line"></div></div></div><div class="library-stats"><span class="library-stat">${total} min read/studied</span><span class="library-stat">${(total/60).toFixed(1)} hours built</span><span class="library-stat">Book thickness = session time</span></div></section>`;
}
function chapterOptions(selectedId){
  const chapters=Array.isArray(state.chapters)?state.chapters:[];
  const grouped={};
  chapters.forEach(c=>{
    const subject=String(c.subject||'General');
    (grouped[subject]||(grouped[subject]=[])).push(c);
  });
  return Object.keys(grouped).sort().map(subject=>`<optgroup label="${esc(subject)}">${grouped[subject].sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(c=>`<option value="${esc(c.id)}" ${c.id===selectedId?'selected':''}>${esc(c.name)} · ${Number(c.mastery)||0}%</option>`).join('')}</optgroup>`).join('');
}
function focusView(){let mins=state.sessions.filter(x=>x.date===today()).reduce((a,x)=>a+x.minutes,0),target=state.profile.dailyGoal||90,cur=state.profile.focusMinutes||25,chapter=state.chapters.find(c=>c.id===state.profile.focusChapterId),conf=state.profile.sessionConfidence||3;document.getElementById('app').innerHTML=`<div class="grid"><section class="card span7"><div class="eyebrow">FOCUS STUDIO</div><div class="row"><div><h2>One task. Full attention.</h2><div class="muted">Give the session a target so your study history becomes more useful.</div></div><span class="tag ${timer.on?'good':''}">${timer.on?'Locked & running':'Ready'}</span></div><div class="ring"><b id="timer">${fmt(timer.sec)}</b></div><div class="focus-book-panel" id="focusBookPanel"><div class="eyebrow">YOUR STUDY BOOK</div><div class="focus-book-stage"><div class="focus-forming-book" id="focusFormingBook"><div class="focus-pages" id="focusBookPages"></div><div class="focus-page-stack" id="focusPageStack"></div><div class="focus-book-title" id="focusBookTitle">${esc(chapter?.name||'Focus Session')}</div><div class="focus-forming-cover"></div></div></div><div class="focus-book-status" id="focusBookStatus">${timer.on?'Your book is forming…':'Start focus to begin a new book'}</div><div class="focus-book-progress" id="focusBookProgress">${timer.on?'0 pages added so far':'Pages will be added as you study'}</div></div><div class="focus-presets">${[15,25,45,60,90].map(n=>`<button class="focus-preset ${cur===n?'active':''}" onclick="setFocusLength(${n})" ${timer.on?'disabled':''}>${n} min</button>`).join('')}</div><div class="focus-custom"><input class="input" id="focusCustom" type="number" min="5" max="120" value="${cur}" ${timer.on?'disabled':''}><button class="btn soft" onclick="applyFocusCustom()" ${timer.on?'disabled':''}>Set time</button></div><div class="focus-panel"><label><span>Focus target</span><select class="input" id="focusChapter" onchange="setFocusTarget(this.value)" ${timer.on?'disabled':''}><option value="">General study</option>${chapterOptions(state.profile.focusChapterId)}</select></label><label><span>Confidence after session</span><select class="input" id="sessionConf" onchange="setSessionConfidence(this.value)">${[1,2,3,4,5].map(n=>`<option value="${n}" ${conf===n?'selected':''}>${n} / 5</option>`).join('')}</select></label></div><div class="target-strip">${chapter?`<b>${esc(chapter.name)}</b><span>${esc(chapter.subject)} · ${chapter.mastery}% mastery</span>`:'<b>General study session</b><span>Choose a chapter above to link this focus block to your syllabus.</span>'}</div><div class="controls" style="justify-content:center;margin-top:14px"><button class="btn" onclick="toggleTimer()">${timer.on?'Focus locked':'Start focus'}</button><button class="btn light" onclick="resetTimer()" ${timer.on?'disabled':''}>Reset</button><button class="btn soft" onclick="logSession()" ${timer.on?'disabled':''}>Log ${cur} min</button></div><p class="mini" style="text-align:center;margin-top:12px">Starting focus activates Focus Lock. Your study time becomes a book in your Study Library when the session is completed.</p></section><section class="card span5"><div class="eyebrow">TODAY</div><h3>Progress to goal</h3><div class="kpi">${mins} <span class="mini">/ ${target} min</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,pct(mins,target))}%"></div></div><div class="mini" style="margin-top:9px">${Math.max(0,target-mins)} minutes remaining.</div><div class="item" style="margin-top:14px"><div class="metric"><span>Current streak</span><b>${currentStreak()} day${currentStreak()===1?'':'s'}</b></div><div class="metric"><span>Sessions today</span><b>${state.sessions.filter(x=>x.date===today()&&x.minutes>0).length}</b></div><div class="metric"><span>Next planned block</span><b>${dailyPlan()[0]?.mins||0}m</b></div></div><h3 style="margin-top:18px">Suggested next block</h3><div class="item"><b>${esc(dailyPlan()[0]?.label||'No plan yet')}</b><div class="mini">${dailyPlan()[0]?.mins||0} minutes · ${esc(dailyPlan()[0]?.reason||'Add a chapter or test to generate a plan.')}</div><button class="btn soft small" style="margin-top:8px" onclick="startPlanBlock(0)">Use this block</button></div></section><section class="card span12 focus-library"><div class="row"><div><div class="eyebrow">STUDY LIBRARY</div><h2>Your study shelf</h2><div class="muted">Every completed focus session becomes a book. Books are arranged from shorter to longer study sessions, with longer sessions creating thicker books.</div></div><span class="tag good">${libraryMinutes()} min studied</span></div>${renderLibrary()}<div class="library-meta"><span>${state.sessions.filter(x=>(Number(x.minutes)||0)>0).length} book${state.sessions.filter(x=>(Number(x.minutes)||0)>0).length===1?'':'s'} collected</span><span>Ordered by study time</span></div></section></div>`}
function libraryMinutes(){return (state.sessions||[]).reduce((a,x)=>a+(Number(x.minutes)||0),0)}
function libraryColor(i){const colors=['#dcece5','#e4efe9','#f1eadb','#d8e8df','#ece6d9','#cfe2d9'];return colors[i%colors.length]}
function renderLibrary(){
  const sessions=sortedLibrarySessions(48);
  if(!sessions.length)return '<div class="library-shelf"><div class="library-empty">No books yet. Complete your first focus session to start building your library.</div></div>';
  const perShelf=window.innerWidth<=620?6:8;
  const shelves=[];
  for(let i=0;i<sessions.length;i+=perShelf)shelves.push(sessions.slice(i,i+perShelf));
  return `<div class="library-case">${shelves.map((group,si)=>`<div class="library-shelf" style="margin-top:${si?'10px':'0'}"><div class="library-books">${group.map((x,i)=>{let c=state.chapters.find(ch=>ch.id===x.chapterId),mins=Math.max(1,Number(x.minutes)||1),w=Math.max(28,Math.min(108,28+mins*.66)),dark=(si*perShelf+i)%5===2;return `<div class="library-book ${dark?'dark':''}" title="${esc((c?.name||'Study session')+' · '+mins+' min')}" style="--book-w:${w}px;width:${w}px;background:${libraryColor(si*perShelf+i)}"><span>${esc(c?.name||'Study session')} · ${mins}m</span></div>`}).join('')}</div><div class="library-shelf-line"></div></div>`).join('')}</div>`;
}
function setFocusTarget(id){if(timer.on)return;state.profile.focusChapterId=id||'';save();focusView()}
function setSessionConfidence(v){state.profile.sessionConfidence=Math.max(1,Math.min(5,Number(v)||3));save()}
function startPlanBlock(index){if(timer.on)return;let plans=dailyPlan(),p=plans[index]||plans[0];if(!p)return;state.profile.focusMinutes=Math.max(5,Math.min(120,Number(p.mins)||25));state.profile.focusChapterId=p.chapterId||'';timer={on:false,sec:state.profile.focusMinutes*60};save();go('Focus')}
function setFocusLength(n){if(timer.on)return;state.profile.focusMinutes=n;timer={on:false,sec:n*60};save();focusView()}
function applyFocusCustom(){if(timer.on)return;let n=Math.max(5,Math.min(120,Number(document.getElementById('focusCustom').value)||25));setFocusLength(n)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function requestWakeLock(){if(!('wakeLock' in navigator)||wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null},{once:true})}catch(e){wakeLock=null}}
async function releaseWakeLock(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}}
function updateFocusLockClock(){syncFocusLock()}
function syncFocusLock(){const el=document.getElementById('focusLockTimer');if(el)el.textContent=fmt(timer.sec);const ch=document.getElementById('focusLockChapter');if(ch){const c=state.chapters.find(x=>x.id===state.profile.focusChapterId);ch.innerHTML=c?`<b>${esc(c.name)}</b><div class="mini" style="margin-top:4px">${esc(c.subject)} · ${c.mastery}% mastery</div>`:'<b>General study session</b><div class="mini" style="margin-top:4px">Stay with the current task.</div>'}updateFocusBook()}
function updateFocusBook(){const total=Math.max(1,(Number(state.profile.focusMinutes)||25)*60);const remaining=Math.max(0,Number(timer.sec)||0);const elapsed=Math.max(0,total-remaining);const progress=timer.on?Math.min(1,elapsed/total):0;const pages=Math.min(48,Math.floor(progress*48));const c=state.chapters.find(x=>x.id===state.profile.focusChapterId);const title=c?.name||'Focus Session';const update=(bookId,stackId,progressId,statusId,titleId,lock=false)=>{const book=document.getElementById(bookId);if(!book)return;book.style.setProperty(lock?'--lock-forming-w':'--forming-w',(lock?62:62)+Math.round(progress*(lock?60:72))+'px');book.style.setProperty(lock?'--lock-pages-w':'--pages-w',(3+Math.round(progress*10))+'px');book.classList.toggle('growing',timer.on&&progress<1);book.classList.toggle('complete',timer.on&&progress>=1);const stack=document.getElementById(stackId);if(stack&&stack.children){for(let i=stack.children.length;i<pages;i++){const page=document.createElement('div');page.className=lock?'focus-lock-page':'focus-page';page.style.bottom=(4+i*2)+'px';stack.appendChild(page)}}const progressEl=document.getElementById(progressId);if(progressEl)progressEl.textContent=timer.on?`${pages} page${pages===1?'':'s'} added · ${Math.round(progress*100)}% formed`:'Pages will be added as you study';const status=document.getElementById(statusId);if(status)status.textContent=timer.on?(progress>=1?'Your book is complete!':'Your book is forming…'):'Start focus to begin a new book';const titleEl=document.getElementById(titleId);if(titleEl)titleEl.textContent=title};update('focusFormingBook','focusPageStack','focusBookProgress','focusBookStatus','focusBookTitle');update('focusLockBook','focusLockPageStack','focusLockBookProgress','focusLockBookStatus','focusLockBookTitle',true)}

async function enterFocusLock(){const lock=document.getElementById('focusLock');if(lock){lock.classList.add('open');lock.setAttribute('aria-hidden','false');syncFocusLock()}document.body.style.overflow='hidden';requestWakeLock();try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}}
async function exitFocusLock(){const lock=document.getElementById('focusLock');if(lock){lock.classList.remove('open');lock.setAttribute('aria-hidden','true')}document.body.style.overflow='';releaseWakeLock();try{if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen()}catch(e){}}
function toggleTimer(){if(timer.on)return;timer.on=true;enterFocusLock();clearInterval(interval);interval=setInterval(()=>{if(timer.sec>0){timer.sec--;syncFocusLock();let e=document.getElementById('timer');if(e)e.textContent=fmt(timer.sec)}else{clearInterval(interval);interval=null;document.getElementById('focusLockBook')?.classList.add('complete');const status=document.getElementById('focusLockBookStatus');if(status)status.textContent='Your book is complete!';setTimeout(()=>{timer.on=false;logSession(true);exitFocusLock();toast('Focus session complete. A new book was added to your library.');focusView()},1100)}},1000);focusView()}
function resetTimer(){if(timer.on)return;clearInterval(interval);timer={on:false,sec:(state.profile.focusMinutes||25)*60};focusView()}
function logSession(autoComplete=false){if(timer.on&&!autoComplete)return;let mins=Math.max(1,Math.round(Number(state.profile.focusMinutes)||25));let chapterId=state.profile.focusChapterId||'';let confidence=Math.max(1,Math.min(5,Number(state.profile.sessionConfidence)||3));state.sessions.push({id:uid(),date:today(),minutes:mins,chapterId,confidence,completedAt:new Date().toISOString()});if(chapterId){let c=state.chapters.find(x=>x.id===chapterId);if(c){c.lastStudied=today();c.confidence=confidence;c.mastery=Math.min(100,Math.round((Number(c.mastery)||0)+Math.max(1,Math.min(5,Math.round(mins/20)))));c.status=c.mastery>=80?'Strong':c.mastery>0?'Learning':'Not started'}}save();if(!autoComplete)resetTimer();else{timer={on:false,sec:(state.profile.focusMinutes||25)*60};focusView()}}
function quickRecall(id){let c=state.chapters.find(x=>x.id===id);if(!c)return;let prompts=[`Define the central idea of ${c.name} in one sentence.`,`Write the 3 formulas/rules you most need from ${c.name}.`,`Name one common mistake in ${c.name} and how you prevent it.`];openSheet(`<div class="eyebrow">30-second recall</div><h2>${esc(c.name)}</h2><p class="quote">${esc(prompts[Math.floor(Math.random()*prompts.length)])}</p><textarea class="input" id="recall" rows="5" placeholder="Answer from memory — no notes."></textarea><div class="controls" style="margin-top:10px"><button class="btn" onclick="completeRecall('${c.id}')">I recalled it</button><button class="btn light" onclick="closeModal()">Exit</button></div>`)}
function completeRecall(id){let c=state.chapters.find(x=>x.id===id);if(c){c.lastStudied=today();c.confidence=Math.min(5,(c.confidence||0)+1);c.mastery=Math.min(100,(c.mastery||0)+2);scheduleFor(id,true);save()}closeModal();render()}
</script>
<script>
// StudyFlow: Subjects, settings, onboarding, import/export and reset
function openSubjectManager(){const rows=subjectList().map((s,i)=>`<div class="item"><label>Subject name<input class="input" data-subject-name="${i}" value="${esc(s.name)}" maxlength="60"></label><div class="controls" style="margin-top:8px"><button class="btn soft small" onclick="renameSubject(${i})">Rename</button><button class="btn danger small" onclick="deleteSubject(${i})">Delete</button></div></div>`).join('');openSheet(`<div class="row"><div><div class="eyebrow">CURRICULUM</div><h2>Manage subjects</h2><div class="muted">Add any curriculum, exam or personal subject.</div></div><button class="btn light" onclick="closeModal()">Close</button></div><div class="list" style="margin-top:14px">${rows||'<div class="empty">No subjects yet.</div>'}</div><div class="item" style="margin-top:12px"><label>New subject<input class="input" id="newSubjectName" placeholder="e.g. Biology, History, English"></label><button class="btn" style="margin-top:9px" onclick="addSubject()">Add subject</button></div>`)}
function addSubject(){const name=(document.getElementById('newSubjectName')?.value||'').trim();if(!name){toast('Enter a subject name');return}if(subjectList().some(s=>s.name.toLowerCase()===name.toLowerCase())){toast('That subject already exists');return}state.profile.subjects.push({id:'subject-'+uid(),name});save();closeModal();render();toast(`${name} added`)}
function renameSubject(index){const subject=subjectList()[index],name=(document.querySelector(`[data-subject-name="${index}"]`)?.value||'').trim();if(!subject||!name){toast('Enter a valid subject name');return}if(subjectList().some((s,i)=>i!==index&&s.name.toLowerCase()===name.toLowerCase())){toast('That subject already exists');return}const old=subject.name;subject.name=name;state.chapters.forEach(c=>{if(c.subject===old)c.subject=name});state.tests.forEach(t=>{if(t.subject===old)t.subject=name});save();closeModal();render();toast('Subject renamed')}
function deleteSubject(index){const subject=subjectList()[index];if(!subject)return;const count=state.chapters.filter(c=>c.subject===subject.name).length;if(subjectList().length<=1){toast('Keep at least one subject');return}if(!confirm(`Delete ${subject.name}? Its ${count} chapter${count===1?'':'s'} will also be removed.`))return;state.profile.subjects.splice(index,1);state.chapters=state.chapters.filter(c=>c.subject!==subject.name);state.revisions=state.revisions.filter(r=>r.subject!==subject.name);state.mistakes=state.mistakes.filter(m=>m.subject!==subject.name);save();closeModal();render();toast('Subject deleted')}
function addChapter(){openSheet(`<h2>Add chapter</h2><div class="formgrid"><label>Subject<select id="as">${subjectNames().map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label>Chapter name<input class="input" id="an" placeholder="Chapter or topic"></label></div><div class="controls" style="margin-top:12px"><button class="btn" onclick="saveChapterNew()">Add chapter</button><button class="btn light" onclick="openSubjectManager()">Manage subjects</button></div>`)}
function saveChapterNew(){let name=document.getElementById('an').value.trim();if(!name){toast('Enter a chapter name.');return}state.chapters.push({id:uid(),subject:document.getElementById('as').value,name,status:'Not started',mastery:0,confidence:0,lastStudied:null,streak:0});save();closeModal();render();toast(`${name} added to syllabus`)}
function openAdd(){openSheet(`<h2>Quick add</h2><div class="controls"><button class="btn" onclick="closeModal();addTest()">Test result</button><button class="btn soft" onclick="closeModal();addMistake()">Mistake</button><button class="btn light" onclick="closeModal();addChapter()">Chapter</button></div>`)}
function weeklyReview(){let s=stats(),mins=state.sessions.slice(-20).reduce((a,x)=>a+x.minutes,0),due=state.revisions.filter(r=>!r.done&&r.date<=today()).length;openSheet(`<h2>Weekly review</h2><div class="list"><div class="item"><b>Study volume</b><div class="mini">${mins} minutes in your recent session log.</div></div><div class="item"><b>Current weak area</b><div class="mini">${esc(s.weak[0]?.name||'No weak chapter recorded')} · ${s.weak[0]?.mastery||0}% mastery.</div></div><div class="item"><b>Revision pressure</b><div class="mini">${due} revision checkpoint(s) are due.</div></div></div><p class="quote" style="margin-top:12px">Next week should not simply be “more study.” Increase work on the highest-signal weak areas and reattempt unresolved mistakes.</p><button class="btn" onclick="closeModal()">Done</button>`)}
function openSettings(){openSheet(`<div class="row"><h2>Settings</h2><button class="btn light" onclick="closeModal()">Close</button></div><div class="formgrid"><label>Name<input class="input" id="pn" value="${esc(state.profile.name)}"></label><label>Daily goal (min)<input class="input" id="pg" type="number" min="15" max="600" value="${state.profile.dailyGoal}"></label><label class="full">Exam / curriculum focus<input class="input" id="pe" value="${esc(state.profile.exam)}" placeholder="Optional — e.g. CBSE, GCSE, university, personal"></label><label>Exam date<input class="input" id="pd" type="date" value="${esc(state.profile.examDate||'')}"></label><label>Next actions<input class="input" id="pa" type="number" min="1" max="8" value="${state.profile.actionCount}"></label><label>Focus length (min)<input class="input" id="pf" type="number" min="5" max="120" value="${state.profile.focusMinutes}"></label><label>Plan block max (min)<input class="input" id="pb" type="number" min="5" max="120" value="${state.profile.blockMax}"></label></div><div class="item" style="margin-top:12px"><b>Adaptive engine inputs</b><div class="controls" style="margin-top:9px"><label class="mini"><input id="pr" type="checkbox" ${state.profile.includeRevisions?'checked':''}> Revisions</label><label class="mini"><input id="pm" type="checkbox" ${state.profile.includeMistakes?'checked':''}> Mistakes</label><label class="mini"><input id="pc" type="checkbox" ${state.profile.includeChapters?'checked':''}> Chapters</label></div></div><div class="item" style="margin-top:12px"><b>App Lock (PIN encryption)</b><p class="muted" style="font-size:13px;margin:6px 0 10px">${lockActive?'Your data is encrypted on this device with a PIN.':'Optional: encrypt your data at rest with a PIN. If you forget it, this data cannot be recovered \u2014 export a backup first.'}</p>${lockActive?'<div class="controls"><button class="btn light" onclick="promptChangePin()">Change PIN</button><button class="btn warn" onclick="promptDisableLock()">Remove PIN lock</button></div>':'<div class="controls"><button class="btn" onclick="promptEnableLock()">Set a PIN</button></div>'}</div><div class="controls" style="margin-top:12px"><button class="btn" onclick="saveSettings()">Save settings</button><button class="btn light" onclick="exportData()">Export backup</button><button class="btn warn" onclick="importData()">Import backup</button><button class="btn danger" onclick="resetAll()">Reset app</button></div>`)}
function openActionCustomizer(){
  const actions=Array.isArray(state.profile.customActions)?state.profile.customActions:[];
  const selected=new Set(actions.filter(x=>x.enabled!==false&&x.chapterId).map(x=>x.chapterId));
  const rows=state.chapters.map(c=>`<label class="item" style="display:flex;align-items:center;gap:10px;margin-bottom:7px"><input type="checkbox" class="action-chapter" value="${esc(c.id)}" ${selected.has(c.id)?'checked':''}><span><b>${esc(c.name)}</b><div class="mini">${esc(c.subject)} · ${Number(c.mastery)||0}% mastery</div></span></label>`).join('');
  openSheet(`<div class="row"><div><div class="eyebrow">NEXT BEST ACTIONS</div><h2>Customize actions</h2><div class="muted">Choose chapters you want to keep in your personal action rotation.</div></div><button class="btn light" onclick="closeModal()">Close</button></div><div style="margin-top:14px;max-height:55vh;overflow:auto">${rows||'<div class="empty">Add a chapter first.</div>'}</div><button class="btn" style="margin-top:12px" onclick="saveActionCustomizer()">Save actions</button>`);
}
function saveActionCustomizer(){
  const selected=[...document.querySelectorAll('.action-chapter:checked')].map(x=>x.value).slice(0,8);
  state.profile.customActions=selected.map(id=>({id:'custom-'+id,chapterId:id,enabled:true}));
  save();closeModal();render();toast('Action preferences saved');
}
function openPlanCustomizer(){
  const plan=dailyPlan();
  const rows=plan.slice(0,6).map((x,i)=>`<div class="item" style="margin-bottom:8px"><div class="row"><b>${i+1}. ${esc(x.label)}</b><span class="tag">${x.mins}m</span></div><div class="mini" style="margin-top:5px">${esc(x.reason)}</div></div>`).join('');
  openSheet(`<div class="row"><div><div class="eyebrow">TODAY'S PLAN</div><h2>Customize today's plan</h2><div class="muted">Use Planner Settings to change time, block length and adaptive inputs.</div></div><button class="btn light" onclick="closeModal()">Close</button></div><div style="margin-top:14px">${rows||'<div class="empty">No plan blocks yet.</div>'}</div><div class="controls" style="margin-top:12px"><button class="btn" onclick="openPlannerSettings()">Open planner settings</button><button class="btn light" onclick="closeModal()">Done</button></div>`);
}
function openPlannerSettings(){
  openSheet(`<div class="row"><div><div class="eyebrow">STUDYFLOW SETTINGS</div><h2>Planner settings</h2><div class="muted">Control how many actions and how much study time StudyFlow plans.</div></div><button class="btn light" onclick="closeModal()">Close</button></div><div class="formgrid" style="margin-top:14px"><label>Next actions<input class="input" id="ca" type="number" min="1" max="8" value="${state.profile.actionCount}"></label><label>Plan mode<select class="input" id="cmode"><option value="adaptive" ${state.profile.planMode==='adaptive'?'selected':''}>Adaptive</option><option value="manual" ${state.profile.planMode==='manual'?'selected':''}>Manual</option></select></label><label>Focus length (min)<input class="input" id="cf" type="number" min="5" max="120" value="${state.profile.focusMinutes}"></label><label>Daily goal (min)<input class="input" id="cg" type="number" min="15" max="600" value="${state.profile.dailyGoal}"></label><label>Max block (min)<input class="input" id="cb" type="number" min="5" max="120" value="${state.profile.blockMax}"></label></div><div class="item" style="margin-top:12px"><b>Use these signals</b><div class="controls" style="margin-top:9px"><label class="mini"><input id="cr" type="checkbox" ${state.profile.includeRevisions?'checked':''}> Revisions</label><label class="mini"><input id="cmis" type="checkbox" ${state.profile.includeMistakes?'checked':''}> Mistakes</label><label class="mini"><input id="cch" type="checkbox" ${state.profile.includeChapters?'checked':''}> Chapters</label></div></div><button class="btn" style="margin-top:12px" onclick="savePlannerSettings()">Apply customization</button>`);
}
function savePlannerSettings(){
  state.profile.actionCount=Math.max(1,Math.min(8,Number(document.getElementById('ca').value)||5));
  state.profile.planMode=document.getElementById('cmode').value==='manual'?'manual':'adaptive';
  state.profile.focusMinutes=Math.max(5,Math.min(120,Number(document.getElementById('cf').value)||25));
  state.profile.dailyGoal=Math.max(15,Math.min(600,Number(document.getElementById('cg').value)||90));
  state.profile.blockMax=Math.max(5,Math.min(120,Number(document.getElementById('cb').value)||25));
  state.profile.includeRevisions=document.getElementById('cr').checked;
  state.profile.includeMistakes=document.getElementById('cmis').checked;
  state.profile.includeChapters=document.getElementById('cch').checked;
  timer={on:false,sec:state.profile.focusMinutes*60};
  save();closeModal();render();toast('Planner settings saved');
}
function saveSettings(){
  state.profile.name=(document.getElementById('pn')?.value||'').trim();
  state.profile.examDate=document.getElementById('pd')?.value||'';
  state.profile.dailyGoal=Math.max(15,Math.min(600,Number(document.getElementById('pg')?.value)||90));
  state.profile.actionCount=Math.max(1,Math.min(8,Number(document.getElementById('pa')?.value)||5));
  state.profile.focusMinutes=Math.max(5,Math.min(120,Number(document.getElementById('pf')?.value)||25));
  state.profile.blockMax=Math.max(5,Math.min(120,Number(document.getElementById('pb')?.value)||25));
  state.profile.includeRevisions=!!document.getElementById('pr')?.checked;
  state.profile.includeMistakes=!!document.getElementById('pm')?.checked;
  state.profile.includeChapters=!!document.getElementById('pc')?.checked;
  state.profile.exam=(document.getElementById('pe')?.value||'').trim();
  timer={on:false,sec:state.profile.focusMinutes*60};
  save();closeModal();render();toast('Settings saved');
}
function pilotSummary(){
  const sessions=state.sessions||[], tests=state.tests||[], mistakes=state.mistakes||[], revs=state.revisions||[];
  const totalMinutes=sessions.reduce((a,x)=>a+(Number(x.minutes)||0),0);
  const focusSessions=sessions.filter(x=>(Number(x.minutes)||0)>0).length;
  const days=new Set(sessions.map(x=>x.date)).size;
  const avgSession=focusSessions?Math.round(totalMinutes/focusSessions):0;
  return {schema:'studyflow-pilot-v1',pilotId:state.profile.pilotId||'',consent:!!state.profile.pilotConsent,exportedAt:new Date().toISOString(),metrics:{focusSessions,totalFocusMinutes:totalMinutes,activeStudyDays:days,averageSessionMinutes:avgSession,testsLogged:tests.length,mistakesLogged:mistakes.length,revisionsCompleted:revs.filter(r=>r.done).length,chaptersTracked:state.chapters.length,mastery:stats().avg,streak:currentStreak()}};
}
function exportPilotReport(){
  if(!state.profile.pilotConsent){openPilotSettings();return}
  const report=pilotSummary();
  const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='studyflow-pilot-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function openPilotSettings(){
  if(!state.profile.pilotId)state.profile.pilotId='SF-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const m=pilotSummary().metrics;
  openSheet(`<div class="row"><div><div class="eyebrow">OPTIONAL PILOT</div><h2>Research & usage report</h2><div class="muted">StudyFlow stays login-free. This report is generated on this device and is only shared when you export it.</div></div><button class="btn light" onclick="closeModal()">Close</button></div>
  <div class="item" style="margin-top:14px"><label class="check"><input id="pilotConsent" type="checkbox" ${state.profile.pilotConsent?'checked':''}> I agree to include these anonymous, aggregated usage metrics in my pilot report.</label><div class="mini" style="margin-top:8px">No name, email, notes, chapter-level records, or detailed academic history are included in the report.</div></div>
  <div class="grid" style="margin-top:12px"><div class="card"><div class="muted">Focus sessions</div><div class="kpi">${m.focusSessions}</div></div><div class="card"><div class="muted">Focus minutes</div><div class="kpi">${m.totalFocusMinutes}</div></div><div class="card"><div class="muted">Study days</div><div class="kpi">${m.activeStudyDays}</div></div><div class="card"><div class="muted">Tests</div><div class="kpi">${m.testsLogged}</div></div></div>
  <div class="controls" style="margin-top:12px"><button class="btn" onclick="savePilotConsent()">Save preference</button><button class="btn light" onclick="exportPilotReport()">Export pilot report</button></div>`);
}
function savePilotConsent(){state.profile.pilotConsent=document.getElementById('pilotConsent').checked;save();closeModal();render()}
function openOnboarding(){
  openSheet(`<div class="onboard"><div class="eyebrow">WELCOME TO STUDYFLOW</div><h2>Build a study system that fits you.</h2><div class="formgrid" style="margin-top:14px"><label>Name (optional)<input class="input" id="obName" placeholder="Your name" value="${esc(state.profile.name||'')}"></label><label>Daily study goal<input class="input" id="obGoal" type="number" min="15" max="600" value="${state.profile.dailyGoal||90}"></label><label class="full">Focus duration<input class="input" id="obFocus" type="number" min="5" max="120" value="${state.profile.focusMinutes||25}"></label></div><div class="item" style="margin-top:14px"><b>Start simple</b><div class="mini" style="margin-top:5px">StudyFlow will use your mastery, revisions, mistakes and test signals to build Today’s Plan. You can customize everything later.</div></div><div class="controls" style="margin-top:14px"><button class="btn" onclick="finishOnboarding()">Start StudyFlow</button><button class="btn light" onclick="skipOnboarding()">Skip setup</button></div></div>`);
}
function finishOnboarding(){state.profile.name=document.getElementById('obName').value.trim();state.profile.dailyGoal=Math.max(15,Math.min(600,Number(document.getElementById('obGoal').value)||90));state.profile.focusMinutes=Math.max(5,Math.min(120,Number(document.getElementById('obFocus').value)||25));state.profile.onboarded=true;save();timer={on:false,sec:state.profile.focusMinutes*60};closeModal();render()}
function skipOnboarding(){state.profile.onboarded=true;save();closeModal();render()}
function exportData(){if(lockActive&&!confirm('App Lock is on, but exported backup files are always plain, unencrypted JSON (so you can restore them without losing your PIN separately). Anyone with this file can read your data. Continue?'))return;let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studyflow-final-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);state.profile.lastBackupAt=today();save()}
function maybeSuggestBackup(){try{let last=state.profile.lastBackupAt,days=last?Math.floor((new Date(today())-new Date(last))/86400000):999;if((state.sessions||[]).length>=5&&days>=14)toast('It has been a while since your last backup — Settings → Export backup keeps your data safe.')}catch(e){}}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{state=migrate(JSON.parse(r.result));save();closeModal();render()}catch(e){toast('Import failed: invalid or unsupported backup.');console.error(e)}};r.readAsText(f)};i.click()}
function resetAll(){
  // Reset immediately. No browser confirm() is used because embedded/file previews
  // can block or ignore native confirmation dialogs.
  try{
    clearInterval(interval); interval=null;
    if(wakeLock){try{wakeLock.release()}catch(e){} wakeLock=null}

    // Remove every locally stored StudyFlow value, including legacy/feature keys.
    try{localStorage.clear()}catch(e){console.warn('localStorage clear failed:',e)}
    try{sessionStorage.clear()}catch(e){}

    // Build a completely fresh state and explicitly empty all user-generated data.
    state=fresh();
    state.profile.onboarded=false;
    state.sessions=[];
    state.completedActions=[];
    state.revisions=[];
    state.mistakes=[];
    state.tests=[];
    state.tasks=[];
    state.weeklyReviews=[];
    state.profile.todayContexts={};
    state.profile.intentions={};
    state.profile.customActions=[];
    state.profile.customPlan=[];
    state.profile.focusChapterId='';

    timer={on:false,sec:(state.profile.focusMinutes||25)*60};
    tab='Today';

    // Persist only the fresh state, then render from that exact in-memory state.
    save();
    closeModal();
    render();
    toast('StudyFlow reset — 0 minutes, 0 books.');
  }catch(e){
    console.error('Reset failed:',e);
    toast('Reset failed. Please reload StudyFlow and try again.');
  }
}
</script>
<script>
// StudyFlow: Dialogs, global listeners and swipe navigation
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){if(timer.on)return;document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(timer.on){e.preventDefault();e.stopPropagation();return;}if(e.key==='Escape')closeModal()});
document.addEventListener('visibilitychange',()=>{if(timer.on && document.visibilityState==='visible'){requestWakeLock();toast('Focus Lock is still running. Stay with your session.');updateFocusLockClock()}});
window.addEventListener('popstate',e=>{if(timer.on){history.pushState(null,'',location.href);e.preventDefault()}});
window.addEventListener('beforeunload',()=>{save()});
(function(){const order=['Today','Syllabus','Backlog','Revision','Mistakes','Tests','Focus','Progress'];let sx=0,sy=0,active=false;const app=document.getElementById('app');if(!app)return;app.addEventListener('touchstart',e=>{if(timer.on||document.getElementById('modal').classList.contains('open'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true},{passive:true});app.addEventListener('touchend',e=>{if(!active)return;active=false;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.4)return;let i=order.indexOf(tab);if(dx<0&&i<order.length-1)go(order[i+1]);else if(dx>0&&i>0)go(order[i-1])},{passive:true});})();
</script>
<script>
// StudyFlow: Error reporting and application boot
window.addEventListener('error', function(e){ console.error('StudyFlow error:', e.error || e.message); });
window.addEventListener('unhandledrejection', function(e){ console.error('StudyFlow promise error:', e.reason); });
if(lockedEnvelope){document.getElementById('lockScreen').style.display='flex';setTimeout(()=>document.getElementById('lockPin')?.focus(),50)}else{state=validateState();save();render();applyTheme();if(!state.profile.onboarded)setTimeout(openOnboarding,180);else setTimeout(maybeSuggestBackup,2500);setTimeout(initCloudSync,300)}
</script>
</body>
</html>
