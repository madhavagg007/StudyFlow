<script>
/**
 * StudyFlow adaptive prioritization engine.
 *
 * Scores a chapter from 0 (do-not-worry-about-it) upward based on five signals:
 *  - mastery gap        (lower mastery -> higher priority)
 *  - confidence gap     (lower stated confidence -> higher priority)
 *  - staleness          (days since last studied, capped at 14 days of effect)
 *  - due revisions      (spaced-repetition items overdue for this chapter)
 *  - mistake frequency  (logged mistakes against this chapter, capped at 4)
 *  - test weakness flag (chapter flagged as a weak topic in a past test)
 *
 * This is a pure function — no globals, no DOM, no dates computed internally
 * beyond what's passed in — so it can be unit tested without the rest of the app.
 */

const WEIGHTS = {
  masteryGap: 0.42,
  confidenceGap: 8,
  staleness: 1.3,
  staleCap: 14,
  revisionDue: 12,
  mistake: 5,
  mistakeCap: 4,
  testWeak: 15,
};

/**
 * @param {object} chapter - { id, name, mastery (0-100), confidence (0-5), lastStudiedDaysAgo (number) }
 * @param {object} signals - {
 *   dueRevisionCount: number,   // overdue revisions for this chapter
 *   mistakeCount: number,       // logged mistakes for this chapter
 *   flaggedWeakInTest: boolean  // chapter appeared as a weak topic in any test
 * }
 * @returns {number} integer priority score, higher = more urgent
 */
function priorityScore(chapter, signals) {
  const mastery = chapter.mastery || 0;
  const confidence = chapter.confidence || 0;
  const stale = Math.min(chapter.lastStudiedDaysAgo ?? 0, 21);
  const revDue = signals.dueRevisionCount || 0;
  const mistakes = signals.mistakeCount || 0;
  const testWeak = !!signals.flaggedWeakInTest;

  const score =
    (100 - mastery) * WEIGHTS.masteryGap +
    (5 - confidence) * WEIGHTS.confidenceGap +
    Math.min(stale, WEIGHTS.staleCap) * WEIGHTS.staleness +
    revDue * WEIGHTS.revisionDue +
    Math.min(mistakes, WEIGHTS.mistakeCap) * WEIGHTS.mistake +
    (testWeak ? WEIGHTS.testWeak : 0);

  return Math.round(score);
}

function priorityLabel(score) {
  if (score >= 65) return "High";
  if (score >= 40) return "Medium";
  return "Low";
}

if (typeof module !== 'undefined' && module.exports) module.exports = { priorityScore, priorityLabel, WEIGHTS };
</script>

async function deriveLockKey(pin,saltB64,iter){const salt=b64d(saltB64);const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptStateEnvelope(saltB64,iter){const iv=crypto.getRandomValues(new Uint8Array(12));const pt=new TextEncoder().encode(JSON.stringify(state));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},lockKey,pt);return{locked:true,salt:saltB64,iter,iv:b64e(iv),data:b64e(ct)}}
let lockWriteQueued=false,lockWriting=false;
function queueLockSave(){lockWriteQueued=true;flushLockSave()}
async function flushLockSave(){if(lockWriting||!lockActive||!lockKey)return;lockWriting=true;lockWriteQueued=false;try{const env=await encryptStateEnvelope(lockSalt,lockIter);localStorage.setItem(KEY,JSON.stringify(env))}catch(e){console.warn('Encrypted save failed',e)}lockWriting=false;if(lockWriteQueued)flushLockSave()}
async function attemptUnlock(){const pin=document.getElementById('lockPin').value,err=document.getElementById('lockError');if(!pin){err.textContent='Enter your PIN.';return}
  try{const key=await deriveLockKey(pin,lockedEnvelope.salt,lockedEnvelope.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(lockedEnvelope.iv)},key,b64d(lockedEnvelope.data));state=migrate(JSON.parse(new TextDecoder().decode(pt)));lockKey=key;lockActive=true;lockSalt=lockedEnvelope.salt;lockIter=lockedEnvelope.iter;document.getElementById('lockScreen').style.display='none';state=validateState();render();applyTheme();setTimeout(maybeSuggestBackup,2500);setTimeout(initCloudSync,300)}
  catch(e){err.textContent='Incorrect PIN. Try again.'}}
function forgotPin(){if(confirm('This permanently erases ALL StudyFlow data on this device. Encrypted data cannot be recovered without the correct PIN. Continue?')){localStorage.removeItem(KEY);(LEGACY_KEYS||[]).forEach(k=>localStorage.removeItem(k));location.reload()}}
function promptEnableLock(){const pin=prompt('Choose a PIN (at least 4 characters):');if(!pin||pin.length<4){if(pin!==null)toast('PIN must be at least 4 characters.');return}const confirmPin=prompt('Confirm your PIN:');if(confirmPin!==pin){toast('PINs did not match.');return}(async()=>{const salt=b64e(crypto.getRandomValues(new Uint8Array(16)).buffer);lockSalt=salt;lockIter=150000;lockKey=await deriveLockKey(pin,salt,lockIter);lockActive=true;await flushLockSave();toast('App Lock enabled — your data is now encrypted on this device.');closeModal();openSettings()})()}
function promptChangePin(){const newPin=prompt('Enter a new PIN:');if(!newPin||newPin.length<4){if(newPin!==null)toast('PIN must be at least 4 characters.');return}(async()=>{const salt=b64e(crypto.getRandomValues(new Uint8Array(16)).buffer);lockSalt=salt;lockIter=150000;lockKey=await deriveLockKey(newPin,salt,lockIter);await flushLockSave();toast('PIN updated.');closeModal();openSettings()})()}
function promptDisableLock(){if(!confirm('Remove PIN lock? Your data will be stored unencrypted on this device from now on.'))return;lockActive=false;lockKey=null;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}toast('App Lock removed.');closeModal();openSettings()}
function applyTheme(){let dark=false;try{dark=localStorage.getItem('studyflow_theme')==='dark'}catch(e){};if(document.body&&document.body.classList)document.body.classList.toggle('dark',dark);let b=document.getElementById('themeBtn');if(b)b.textContent=dark?'Light':'Dim'}
function toggleTheme(){let dark=document.body.classList.toggle('dark');localStorage.setItem('studyflow_theme',dark?'dark':'light');let b=document.getElementById('themeBtn');if(b)b.textContent=dark?'Light':'Dim'}
function save(){try{state.version=APP_VERSION;state.schema='studyflow';state.savedAt=new Date().toISOString();if(lockActive&&lockKey){queueLockSave()}else{localStorage.setItem(KEY,JSON.stringify(state))}queueCloudSync();return true}catch(e){toast('Could not save locally. Export a backup before continuing.');return false}}

<script>
// StudyFlow: Optional account sync hook (inactive unless a host provides it)
let cloudDb=null,cloudUid=null,cloudWriting=false,cloudPending=false,cloudTimer=null;
async function initCloudSync(){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    const userCap=await claude.use('user'),dbCap=await claude.use('db');
    if(!userCap||!dbCap)return;
    const uid=await userCap.id();
    if(!uid)return;
    const ref=dbCap.doc('data/users/'+uid+'/state');
    const snap=await ref.get();
    if(snap.exists){
      const cloud=migrate(snap.data());
      if(!state.savedAt||(cloud.savedAt&&cloud.savedAt>state.savedAt)){state=cloud;localStorage.setItem(KEY,JSON.stringify(state));render()}
    }
    cloudDb=dbCap;cloudUid=uid;
    toast('Cloud sync connected for your account.');
  }catch(e){console.warn('Cloud sync unavailable — continuing with local storage only:',e)}
}
function queueCloudSync(){if(!cloudDb||!cloudUid)return;cloudPending=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloudSync,1200)}
async function flushCloudSync(){
  if(!cloudDb||!cloudUid||cloudWriting)return;
  cloudWriting=true;cloudPending=false;
  try{await cloudDb.doc('data/users/'+cloudUid+'/state').set(JSON.parse(JSON.stringify(state)))}catch(e){console.warn('Cloud sync write failed:',e)}
  cloudWriting=false;
  if(cloudPending)flushCloudSync();
}
function safeNumber(v,min,max,fallback){let n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback}
function validateState(){if(!state||typeof state!=='object')state=fresh();state.chapters=Array.isArray(state.chapters)?state.chapters:[];state.revisions=Array.isArray(state.revisions)?state.revisions:[];state.mistakes=Array.isArray(state.mistakes)?state.mistakes:[];state.tests=Array.isArray(state.tests)?state.tests:[];state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.completedActions=Array.isArray(state.completedActions)?state.completedActions:[];state.profile=state.profile||fresh().profile;state.profile.subjects=Array.isArray(state.profile.subjects)&&state.profile.subjects.length?state.profile.subjects:fresh().profile.subjects;state.profile.dailyGoal=safeNumber(state.profile.dailyGoal,15,600,90);state.profile.focusMinutes=safeNumber(state.profile.focusMinutes,5,120,25);state.profile.actionCount=safeNumber(state.profile.actionCount,1,8,5);state.profile.blockMax=safeNumber(state.profile.blockMax,5,120,45);state.profile.todayContexts=(state.profile.todayContexts&&typeof state.profile.todayContexts==='object')?state.profile.todayContexts:{};state.profile.intentions=(state.profile.intentions&&typeof state.profile.intentions==='object')?state.profile.intentions:{};state.profile.customActions=Array.isArray(state.profile.customActions)?state.profile.customActions:[];state.profile.customPlan=Array.isArray(state.profile.customPlan)?state.profile.customPlan:[];state.profile.includeRevisions=state.profile.includeRevisions!==false;state.profile.includeMistakes=state.profile.includeMistakes!==false;state.profile.includeChapters=state.profile.includeChapters!==false;state.profile.planMode=state.profile.planMode==='manual'?'manual':'adaptive';state.profile.focusChapterId=state.profile.focusChapterId||'';state.profile.sessionConfidence=safeNumber(state.profile.sessionConfidence,1,5,3);return state}
state=validateState();
</script>
<script>
// StudyFlow: Navigation, stats and the adaptive planning engine glue
function nav(){let items=['Today','Syllabus','Backlog','Revision','Mistakes','Tests','Focus','Progress'];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${tab===x?'active':''}" onclick="go('${x}')" aria-label="Open ${x}">${x}</button>`).join('');document.getElementById('bottom').innerHTML=items.map(x=>`<button class="${tab===x?'active':''}" onclick="go('${x}')" aria-label="Open ${x}">${x}</button>`).join('');try{document.querySelector('#bottom button.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}catch(e){}}
function go(x){if(timer.on&&x!=='Focus'){toast('Focus Lock is active — finish the timer first.');return}tab=x;nav();render()}
function render(){try{nav();const view={Today:todayView,Syllabus:syllabus,Backlog:backlog,Revision:revision,Mistakes:mistakes,Tests:tests,Focus:focusView,Progress:progress}[tab]||todayView;view();const appEl=document.getElementById('app');if(appEl){appEl.classList.remove('view-enter');void appEl.offsetWidth;appEl.classList.add('view-enter')}}catch(e){console.error('StudyFlow render error:',e);const app=document.getElementById('app');if(app){if(tab==='Today'){app.innerHTML=`<div class="grid"><section class="card hero span12"><div class="eyebrow" style="color:#9fb8ae">STUDYFLOW</div><h2 style="font-size:28px;color:var(--gold)">Your study cockpit</h2><p class="muted">Your saved study data is still here. Open a section below to continue.</p><div class="controls"><button class="btn soft" onclick="go('Focus')">Start focus</button><button class="btn light" onclick="go('Mistakes')">Mistakes</button><button class="btn light" onclick="go('Tests')">Tests</button><button class="btn light" onclick="go('Syllabus')">Syllabus</button></div></section><section class="card span4"><div class="kpi">${state.sessions.length}</div><div class="mini">Focus sessions</div></section><section class="card span4"><div class="kpi">${state.mistakes.length}</div><div class="mini">Mistakes saved</div></section><section class="card span4"><div class="kpi">${state.tests.length}</div><div class="mini">Tests saved</div></section></div>`;}else app.innerHTML=`<section class="card" style="margin-top:14px"><h2>StudyFlow needs a quick refresh</h2><p class="muted">This section hit an error, but your saved data has not been intentionally deleted.</p><div class="controls"><button class="btn" onclick="location.reload()">Refresh</button><button class="btn light" onclick="go('Today')">Home</button></div></section>`;}}}
function weekData(){let out=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10),m=state.sessions.filter(x=>x.date===ds).reduce((a,x)=>a+(Number(x.minutes)||0),0);out.push({d:ds,m});}return out}
function currentStreak(){let streak=0;for(let i=0;i<365;i++){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10);if(state.sessions.some(x=>x.date===ds&&(Number(x.minutes)||0)>0))streak++;else if(i>0)break;}return streak}
function subjectStats(){return subjectNames().map(sub=>{let cs=state.chapters.filter(c=>c.subject===sub),avg=cs.length?Math.round(cs.reduce((a,c)=>a+(c.mastery||0),0)/cs.length):0;return {sub,avg,count:cs.length}})}
function stats(){let avg=pct(state.chapters.reduce((a,c)=>a+(c.mastery||0),0),state.chapters.length*100),mastered=state.chapters.filter(c=>(c.mastery||0)>=80).length,weak=state.chapters.slice().sort((a,b)=>(a.mastery||0)-(b.mastery||0));return {avg,mastered,weak}}
function daysSince(d){if(!d)return 999;return Math.max(0,Math.floor((new Date(today())-new Date(d))/86400000))}
function priority(c){return priorityScore({mastery:c.mastery,confidence:c.confidence,lastStudiedDaysAgo:daysSince(c.lastStudied)},{dueRevisionCount:state.revisions.filter(r=>r.chapterId===c.id&&!r.done&&r.date<=today()).length,mistakeCount:state.mistakes.filter(m=>m.chapterId===c.id).length,flaggedWeakInTest:state.tests.some(t=>(t.weakTopics||[]).some(w=>w.chapterId===c.id||w.name===c.name))})}
function bestActions(){let items=[];state.chapters.forEach(c=>items.push({score:priority(c),type:'chapter',chapter:c}));state.revisions.filter(r=>!r.done&&r.date<=today()).forEach(r=>items.push({score:95,type:'revision',rev:r}));state.mistakes.filter(m=>!m.reattempted).slice(-5).forEach(m=>items.push({score:70,type:'mistake',mistake:m}));return items.sort((a,b)=>b.score-a.score).slice(0,Math.max(1,Math.min(8,state.profile.actionCount||5)))}function whyPriority(c){let reasons=[];let mastery=Number(c.mastery)||0,confidence=Number(c.confidence)||0;if(mastery<70)reasons.push(`mastery ${mastery}% is below the strong range`);if(confidence<3)reasons.push(`confidence is ${confidence}/5`);if(!c.lastStudied)reasons.push('you have not logged a study session yet');else{let age=Math.max(0,Math.round((new Date(today())-new Date(c.lastStudied))/86400000));if(age>=3)reasons.push(`${age} days since last study`)}let due=state.revisions.filter(r=>!r.done&&r.chapterId===c.id&&r.date<=today()).length;if(due)reasons.push(`${due} overdue revision checkpoint${due>1?'s':''}`);let mistakes=state.mistakes.filter(m=>!m.reattempted&&m.chapterId===c.id).length;if(mistakes)reasons.push(`${mistakes} unresolved mistake${mistakes>1?'s':''}`);let tests=state.tests.filter(t=>(t.weakTopics||[]).some(w=>w.chapterId===c.id)).length;if(tests)reasons.push(`${tests} test signal${tests>1?'s':''}`);return reasons.length?reasons:['steady maintenance keeps this chapter in rotation']}
function toggleWhy(id){let el=document.getElementById(id);if(el)el.hidden=!el.hidden}
function progress(){let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);let mins=state.sessions.filter(x=>x.date===key).reduce((a,x)=>a+(Number(x.minutes)||0),0);days.push({key,mins})}let max=Math.max(30,...days.map(d=>d.mins)),avg=days.reduce((a,d)=>a+d.mins,0)/7,weak=state.chapters.slice().sort((a,b)=>a.mastery-b.mastery).slice(0,5),patterns={};state.mistakes.forEach(m=>patterns[m.type||'Other']=(patterns[m.type||'Other']||0)+1);let ps=Object.entries(patterns).sort((a,b)=>b[1]-a[1]);document.getElementById('app').innerHTML=`<div class="row"><div><h2>Progress & insights</h2><div class="muted">Track consistency, mastery and recurring error patterns.</div></div></div><div class="insight-grid" style="margin-top:12px"><section class="card"><div class="eyebrow">7-DAY FOCUS</div><div class="kpi">${Math.round(avg)}m <span class="mini">avg/day</span></div><div class="insight-chart">${days.map(d=>`<div class="chart-col"><div class="chart-bar" style="height:${Math.max(4,Math.round(d.mins/max*135))}px" title="${d.mins} minutes"></div><div class="chart-label">${d.key.slice(5)}</div></div>`).join('')}</div></section><section class="card"><div class="eyebrow">MASTERY</div><div class="kpi">${stats().avg}%</div><div class="mini">Average across ${state.chapters.length} chapters</div><div style="margin-top:14px">${weak.map(c=>`<div class="metric"><span>${esc(c.name)}</span><b>${c.mastery}%</b></div>`).join('')||'<div class="empty">Add chapters to see mastery.</div>'}</div></section><section class="card"><div class="eyebrow">ERROR PATTERNS</div><h3>Recurring causes</h3>${ps.map(([k,v])=>`<div class="pattern-row"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div class="empty">No mistake pattern yet.</div>'}</section><section class="card"><div class="eyebrow">CONSISTENCY</div><h3>${currentStreak()} day streak</h3><p class="muted">${days.filter(d=>d.mins>0).length}/7 days had recorded focus this week.</p><div class="bar"><div class="fill" style="width:${Math.round(days.filter(d=>d.mins>0).length/7*100)}%"></div></div></section>${readinessCard()}</div><div class="controls" style="margin-top:12px"><button class="btn" onclick="printReport()">Print / save progress report</button></div>`}

function smartTasks(){let custom=(state.profile.customActions||[]).filter(x=>x.enabled!==false&&x.chapterId).slice(0,8).map((x,i)=>{let c=state.chapters.find(c=>c.id===x.chapterId);return c?{id:'custom'+i,label:x.label||`Study ${x.customChapterName||c.name}`,sub:`${c.subject} · customized action`,kind:'chapter',ref:c.id,color:x.color||'#276653',custom:true}:null}).filter(Boolean);let auto=bestActions().filter(x=>(x.type==='revision'?state.profile.includeRevisions:x.type==='mistake'?state.profile.includeMistakes:state.profile.includeChapters)).map(x=>{if(x.type==='revision')return {id:'r'+x.rev.id,label:`Recall: ${x.rev.chapter}`,sub:`${x.rev.subject} · overdue revision`,kind:'revision',ref:x.rev.id,color:'#c99635'};if(x.type==='mistake')return {id:'m'+x.mistake.id,label:`Reattempt: ${x.mistake.topic}`,sub:`${x.mistake.type} error · fix it without notes`,kind:'mistake',ref:x.mistake.id,color:'#b65d4b'};return {id:'c'+x.chapter.id,label:`Strengthen ${x.chapter.name}`,sub:`${x.chapter.subject} · ${x.chapter.mastery}% mastery · ${priorityLabel(x.score)} priority`,kind:'chapter',ref:x.chapter.id,color:'#276653',why:whyPriority(x.chapter)}});return [...custom,...auto].slice(0,Math.max(1,Math.min(8,state.profile.actionCount||5)))}
function dayContext(){let d=state.profile.todayContexts?.[today()]||{};return {available:safeNumber(d.available,15,600,state.profile.dailyGoal||90),energy:String(d.energy||'Normal')};}
function openTodayConditions(){let d=dayContext();openSheet(`<div class="row"><div><div class="eyebrow">TODAY'S CONDITIONS</div><h2>Fit the plan to today.</h2><div class="muted">This only affects today’s plan. Your long-term data stays unchanged.</div></div><button class="btn light" onclick="closeModal()">Close</button></div><div class="formgrid" style="margin-top:14px"><label>Available study time today<input class="input" id="dayAvail" type="number" min="15" max="600" value="${d.available}"><span class="mini">Use the time you realistically have today.</span></label><label>Energy level<select class="input" id="dayEnergy"><option ${d.energy==='Low'?'selected':''}>Low</option><option ${d.energy==='Normal'?'selected':''}>Normal</option><option ${d.energy==='High'?'selected':''}>High</option></select></label></div><div class="item" style="margin-top:14px"><b>How StudyFlow uses this</b><div class="mini" style="margin-top:6px">Available time caps today’s plan. Energy is shown as context so you can choose a realistic block rather than forcing your usual routine.</div></div><button class="btn" style="margin-top:14px" onclick="saveTodayConditions()">Update today</button>`)}
function saveTodayConditions(){let available=safeNumber(document.getElementById('dayAvail').value,15,600,state.profile.dailyGoal||90);let energy=document.getElementById('dayEnergy').value;state.profile.todayContexts=state.profile.todayContexts||{};state.profile.todayContexts[today()]={available,energy};save();closeModal();render()}
function dailyPlan(){let minutes=dayContext().available;let custom=(state.profile.customPlan||[]).filter(x=>x.enabled!==false&&x.chapterId).map(x=>{let c=state.chapters.find(c=>c.id===x.chapterId);return c?{label:x.label||`Study ${x.customChapterName||c.name}`,mins:Math.max(5,Math.min(120,Number(x.mins)||25)),reason:x.reason||`${c.subject} · customized block`,color:x.color||'#276653',custom:true,chapterId:c.id}:null}).filter(Boolean);if(custom.length)return custom.reduce((arr,x)=>{let left=minutes-arr.reduce((a,b)=>a+b.mins,0);if(left>0)arr.push({...x,mins:Math.min(x.mins,left)});return arr},[]);if(state.profile.planMode==='manual')return [{label:'Custom plan mode',mins:Math.min(state.profile.blockMax||25,minutes),reason:'Choose your own next task from Next best actions',color:'#276653',chapterId:''}];let actions=bestActions().filter(x=>(x.type==='revision'?state.profile.includeRevisions:x.type==='mistake'?state.profile.includeMistakes:state.profile.includeChapters));let used=0,blocks=[];for(let x of actions){if(used>=minutes)break;let mins=x.type==='revision'?20:x.type==='mistake'?15:(state.profile.blockMax||25);mins=Math.min(mins,minutes-used);let label=x.type==='revision'?`Recall ${x.rev.chapter}`:x.type==='mistake'?`Reattempt ${x.mistake.topic}`:`Study ${x.chapter.name}`,chapterId=x.type==='revision'?x.rev.chapterId:x.type==='mistake'?x.mistake.chapterId:x.chapter.id;blocks.push({label,mins,reason:x.type==='chapter'?`Priority ${priorityLabel(x.score)}`:'Due signal',color:x.type==='revision'?'#c99635':x.type==='mistake'?'#b65d4b':'#276653',chapterId});used+=mins}if(!blocks.length)blocks.push({label:'Choose one chapter and log a focus session',mins:Math.min(25,minutes),reason:'No urgent signals yet',color:'#276653',chapterId:''});return blocks}
function actionCompleted(id){return (state.completedActions||[]).some(x=>x.date===today()&&x.id===id)}
function completeAction(id){if(!state.completedActions)state.completedActions=[];let i=state.completedActions.findIndex(x=>x.date===today()&&x.id===id);if(i>=0)state.completedActions.splice(i,1);else state.completedActions.push({id,date:today()});state.completedActions=state.completedActions.slice(-500);save();render()}
function todayCompletion(){let tasks=smartTasks();return {done:tasks.filter(t=>actionCompleted(t.id)).length,total:tasks.length}}
function goalProgress(){let goal=state.profile.dailyGoal||90,done=state.sessions.filter(x=>x.date===today()).reduce((a,x)=>a+(Number(x.minutes)||0),0);return {goal,done,left:Math.max(0,goal-done),pct:Math.min(100,Math.round(done/goal*100))}}
</script>
<script>
// StudyFlow: Today, progress and shared views
function sortedLibrarySessions(limit=24){return (state.sessions||[]).filter(x=>(Number(x.minutes)||0)>0).slice().sort((a,b)=>{let d=(Number(a.minutes)||0)-(Number(b.minutes)||0);if(d!==0)return d;return String(a.completedAt||a.date||'').localeCompare(String(b.completedAt||b.date||''))}).slice(0,limit)}
function homeStudyLibraryMarkup(){
  const sessions=sortedLibrarySessions(48);
  if(!sessions.length)return `<section class="card span12 home-study-library"><div class="row"><div><div class="eyebrow">YOUR STUDY LIBRARY</div><h2>Build your library, one session at a time.</h2><div class="muted">Every completed focus session becomes a book. Longer study sessions create thicker books.</div></div><span class="tag good">0 books</span></div><div class="home-library-case"><div class="home-library-row"><div class="library-empty">Complete your first focus session to place your first book on the shelf.</div></div></div></section>`;

  for(let i=0;i<sessions.length;i+=perShelf)shelves.push(sessions.slice(i,i+perShelf));
  const shelfMarkup=shelves.map((group,si)=>{
    const books=group.map((x,i)=>{
      const c=state.chapters.find(ch=>ch.id===x.chapterId),mins=Math.max(1,Number(x.minutes)||1);
      const w=Math.max(24,Math.min(82,24+mins*.72));
      const dark=(si*perShelf+i)%5===2;
      return `<div class="home-library-book ${dark?'dark':''}" title="${esc((c?.name||'Study session')+' · '+mins+' min')}" style="width:${w}px;background:${libraryColor(si*perShelf+i)}"><span>${esc(c?.name||'Study session')} · ${mins}m</span></div>`;
    }).join('');
    return `<div class="home-library-row"><span class="home-library-label">Shelf ${si+1}</span><div class="home-library-books">${books}</div></div>`;
  }).join('');
  const total=sessions.reduce((a,x)=>a+(Number(x.minutes)||0),0);
  return `<section class="card span12 home-study-library"><div class="row"><div><div class="eyebrow">YOUR STUDY LIBRARY</div><h2>Your study becomes a library.</h2><div class="muted">Every completed focus session becomes a book. Books are arranged from shorter to longer sessions, and each shelf fills before the next one begins.</div></div><span class="tag good">${sessions.length} book${sessions.length===1?'':'s'}</span></div><div class="home-library-case">${shelfMarkup}</div><div class="library-meta"><span>${total} min represented</span><span>${shelves.length} shelf${shelves.length===1?'':'s'} · shortest → longest</span></div></section>`;
}
function todayView(){
  /* Keep the full preview Home screen resilient on Android/local HTML viewers. */
  let inactiveDays=null,s={avg:0,mastered:0,weak:[]},tasks=[],doneToday=0,plan=[],name='Your study cockpit',gc={goal:90,done:0,left:90,pct:0},ac={done:0,total:0},dc={available:90,energy:'Normal'},streak=0,todaySessions=0;
  try{let dates=(state.sessions||[]).map(x=>x.date).filter(Boolean).sort().reverse();if(dates.length)inactiveDays=Math.max(0,Math.round((new Date(today())-new Date(dates[0]))/86400000));}catch(e){}
  try{s=stats()||s}catch(e){}

<script>
// StudyFlow: Backlog planner, exam readiness and printable report
function examDaysLeft(){let d=state.profile.examDate;if(!d)return null;return Math.ceil((new Date(d)-new Date(today()))/86400000)}
function overdueSet(){return new Set(state.revisions.filter(r=>!r.done&&r.date<today()).map(r=>r.chapterId))}
function backlogSpent(c){let since=c.backlogAdded||'0000-00-00';return state.sessions.filter(s=>s.chapterId===c.id&&s.date>=since).reduce((a,s)=>a+(Number(s.minutes)||0),0)}
function fmtMin(m){m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':''):m+'m'}
function backlogItems(){let od=overdueSet();return state.chapters.map(c=>{let manual=!!c.backlog,reason=null;if(manual)reason='Your backlog';else if(od.has(c.id))reason='Revision overdue';else if((c.mastery||0)<60&&c.lastStudied&&daysSince(c.lastStudied)>=14)reason='Going stale';if(!reason)return null;let est=manual?Math.max(5,Number(c.backlogEst)||45):45,spent=manual?backlogSpent(c):0,due=(manual&&c.backlogDue)||state.profile.examDate||'';return{c,reason,manual,est,spent,remaining:Math.max(0,est-spent),due,score:priority(c)}}).filter(Boolean)}
function backlogPlan(){let cap=Math.max(15,Math.min(600,Number(state.profile.backlogMinPerDay)||60)),items=backlogItems().filter(x=>x.remaining>0).sort((a,b)=>{let da=a.due||'9999-99-99',db=b.due||'9999-99-99';return da<db?-1:da>db?1:b.score-a.score}),left=items.map(x=>({x,rem:x.remaining})),days=[],i=0;while(left.length&&i<90){let room=cap,blocks=[],dt=new Date();dt.setDate(dt.getDate()+i);let ds=dt.toISOString().slice(0,10);while(room>0&&left.length){let t=left[0],take=Math.min(room,t.rem);blocks.push({x:t.x,min:take});t.rem-=take;room-=take;if(t.rem<=0){t.x.finish=ds;left.shift()}}days.push({date:ds,i,blocks,total:cap-room});i++}let total=items.reduce((a,x)=>a+x.remaining,0),need=0,cum=0;items.filter(x=>x.due).forEach(x=>{cum+=x.remaining;let d=Math.max(1,Math.ceil((new Date(x.due)-new Date(today()))/86400000)+1);need=Math.max(need,Math.ceil(cum/d))});let late=items.filter(x=>x.due&&(!x.finish||x.finish>x.due)),done=items.length&&items.every(x=>x.finish);return{cap,items,days,total,need,late,finish:done?items.reduce((a,x)=>x.finish>a?x.finish:a,''):null}}
function sampleChapters(){let n=new Set(Object.values(STARTER_CHAPTERS).flat());return state.chapters.filter(c=>n.has(c.name)&&c.status==='Not started'&&!c.lastStudied&&!c.backlog&&!state.sessions.some(s=>s.chapterId===c.id)&&!state.mistakes.some(m=>m.chapterId===c.id)&&!state.revisions.some(r=>r.chapterId===c.id))}
function removeSampleChapters(){let s=sampleChapters();if(!s.length)return;if(!confirm('Remove '+s.length+' untouched sample chapters? Chapters you studied or added are kept.'))return;let ids=new Set(s.map(c=>c.id));state.chapters=state.chapters.filter(c=>!ids.has(c.id));if(ids.has(state.profile.focusChapterId))state.profile.focusChapterId='';save();toast(s.length+' sample chapters removed.');render()}
function backlog(){let p=backlogPlan(),it=p.items,fd=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}),row=x=>`<div class="metric" style="cursor:pointer;gap:10px" onclick="openBacklogItem('${x.c.id}')"><span>${esc(x.c.name)} <span class="mini">· ${esc(x.c.subject)}${x.manual?'':' · '+esc(x.reason)}</span></span><b>${fmtMin(x.remaining)}${x.due?' · by '+x.due.slice(5):''}${p.late.includes(x)?' ⚠':''}</b></div>`,status=!it.length?'':p.late.length?`<div class="mini" style="color:#b65d4b;margin-top:8px">${p.late.length} item${p.late.length>1?'s':''} will miss their deadline at ${p.cap} min/day. You need about ${p.need} min/day, or move the deadlines.</div>`:`<div class="mini" style="margin-top:8px">On track${p.need?'. Minimum needed for your deadlines: '+p.need+' min/day':''}.</div>`,plan=p.days.slice(0,7).map(d=>`<div style="margin-top:12px"><b>${d.i===0?'Today':d.i===1?'Tomorrow':fd(d.date)}</b> <span class="mini">· ${fmtMin(d.total)}</span>${d.blocks.map(b=>`<div class="metric" style="gap:10px"><span>${esc(b.x.c.name)} <span class="mini">· ${esc(b.x.c.subject)}</span></span><span><b>${fmtMin(b.min)}</b> <button class="btn light" style="padding:4px 10px" onclick="startBacklogFocus('${b.x.c.id}')">Focus</button></span></div>`).join('')}</div>`).join(''),samples=sampleChapters().length;document.getElementById('app').innerHTML=`<div class="row"><div><h2>Backlog</h2><div class="muted">${it.length?`${it.length} item${it.length>1?'s':''} · ${fmtMin(p.total)} left to finish.`:'Add what you have fallen behind on and get a plan to finish it.'}</div></div><div class="controls"><button class="btn" onclick="openAddBacklog()">+ Add backlog</button></div></div><div class="insight-grid" style="margin-top:12px">${it.length?`<section class="card"><div class="eyebrow">FINISH PLAN</div><h3>${p.finish?'Done by '+fd(p.finish):'More than 90 days at this pace'}</h3><label class="mini" style="display:block;margin-top:10px">Minutes per day function saveBacklog(){let names=(document.getElementById('bn').value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,50);if(!names.length){toast('Enter at least one backlog item.');return}let subj=document.getElementById('bs').value,est=Math.max(5,Math.min(1200,Number(document.getElementById('be').value)||60)),due=document.getElementById('bd').value||'';names.forEach(n=>{let ex=state.chapters.find(c=>c.subject===subj&&c.name.toLowerCase()===n.toLowerCase());if(ex){ex.backlog=true;ex.backlogEst=est;ex.backlogDue=due;ex.backlogAdded=today()}else state.chapters.push({id:uid(),subject:subj,name:n,status:'Not started',mastery:0,confidence:0,lastStudied:null,streak:0,backlog:true,backlogEst:est,backlogDue:due,backlogAdded:today()})});save();closeModal();toast(names.length+' added to backlog.');render()}
function openBacklogItem(id){let c=state.chapters.find(x=>x.id===id);if(!c)return;let it=backlogItems().find(x=>x.c.id===id),m=!!c.backlog;openSheet(`<div class="row"><div><div class="eyebrow">${esc(c.subject)}</div><h2>${esc(c.name)}</h2></div><button class="btn light" onclick="closeModal()">Close</button></div>${m?'':`<p class="muted">Flagged automatically: ${esc(it?it.reason:'')}. Add it to your backlog to plan time for it.</p>`}<div class="formgrid"><label>Time needed (min)<input class="input" id="bie" type="number" min="5" max="1200" value="${m?(c.backlogEst||60):60}"></label><label>Deadline<input class="input" id="bid" type="date" value="${esc(c.backlogDue||'')}"></label></div>${m&&it?`<div class="mini" style="margin-top:8px">${it.spent} of ${it.est} min logged. Focus sessions count when this chapter is selected as the target.</div>`:''}<div class="controls" style="margin-top:12px"><button class="btn" onclick="saveBacklogItem('${id}')">${m?'Save':'Add to backlog'}</button>${m?`<button class="btn light" onclick="markBacklogDone('${id}')">Mark done</button><button class="btn warn" onclick="removeBacklog('${id}')">Remove</button>`:''}<button class="btn light" onclick="closeModal();openChapter('${id}')">Open chapter</button></div>`)}
function saveBacklogItem(id){let c=state.chapters.find(x=>x.id===id);if(!c)return;c.backlog=true;c.backlogEst=Math.max(5,Math.min(1200,Number(document.getElementById('bie').value)||60));c.backlogDue=document.getElementById('bid').value||'';c.backlogAdded=c.backlogAdded||today();save();closeModal();toast('Backlog item saved.');render()}
function markBacklogDone(id){let c=state.chapters.find(x=>x.id===id);if(!c)return;c.backlog=false;c.backlogDoneAt=today();c.lastStudied=today();if(c.status==='Not started')c.status='Learning';save();try{scheduleFor(id,true)}catch(e){}closeModal();toast('Cleared from backlog. Revisions scheduled.');render()}
function removeBacklog(id){let c=state.chapters.find(x=>x.id===id);if(!c||!confirm('Remove this from your backlog?'))return;let untouched=!c.lastStudied&&!(c.mastery>0)&&!state.sessions.some(s=>s.chapterId===id)&&!state.mistakes.some(m=>m.chapterId===id)&&!state.revisions.some(r=>r.chapterId===id);if(untouched){state.chapters=state.chapters.filter(x=>x.id!==id);if(state.profile.focusChapterId===id)state.profile.focusChapterId=''}else{c.backlog=false;delete c.backlogEst;delete c.backlogDue}save();closeModal();render()}

function readiness(list){if(!list.length)return 0;let od=overdueSet(),m=list.reduce((a,c)=>a+(c.mastery||0),0)/list.length,cov=list.filter(c=>c.lastStudied||c.status!=='Not started').length/list.length*100,started=list.filter(c=>c.lastStudied||c.status!=='Not started'),health=started.length?100-started.filter(c=>od.has(c.id)).length/started.length*100:0;return Math.round(m*.6+cov*.25+health*.15)}
